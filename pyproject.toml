[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rashomon"
version = "0.1.0"
description = "Run the same SPARQL queries on several engines and report where their answers differ."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rashomon = "rashomon.cli:main"

[tool.setuptools.packages.find]
include = ["rashomon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
